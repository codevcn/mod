mod_tool:
  # Dispatcher chỉ xử lý 2 flag, mọi args sau action được forward cho feature.
  dispatcher_flags:
    - flag: "--des"
      description: "In mô tả chi tiết command từ app_features.yml."
    - flag: "-a / --antigravity-IDE"
      description: "Dùng Antigravity IDE thay vì VSCode."

  feature_flags:
    - flag: "-h / --help"
      description: "In help ra terminal (đặt ở vị trí type)."
    - flag: "-m / --message"
      description: "Truyền commit message cho git commit. Do _git.py tự parse."
    - flag: "-p / --powershell-only"
      description: "Chỉ mở folder trong Windows Terminal, không mở IDE. Do open_main_ws.py tự parse."
    - flag: "-d / --deep"
      description: "Liệt kê đệ quy sâu. Do sync_to_gdrive.py tự parse."
    - flag: "-f / --file"
      description: "Liệt kê file thay vì folder (gdrive list) hoặc mở File Explorer (open). Dispatcher detect flag này cho type open."
    - flag: "--protocol"
      description: "Chỉ định protocol test proxy (http, socks5, v.v.). Mặc định là socks5. Dùng trong mod proxy test."

  types:
    - name: "open"
      description: "Mở trong System Explorer"
      actions:
        - id: "ACTION 01"
          title: "Mở mod files trong VSCode"
          command: "mod open"
          summary: "Mở thư mục gốc của mod project trong IDE."
          details: "Chạy `code <MOD_ROOT_FOLDER>` hoặc `anti <MOD_ROOT_FOLDER>` tùy theo flag `-a`."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 01b"
          title: "Mở mod files trong File Explorer"
          command: "mod open -f"
          summary: "Mở thư mục gốc của mod project trong File Explorer."
          details: "Flag `-f` được dispatcher detect ở vị trí action hoặc remaining args để route sang File Explorer thay vì IDE."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 02"
          title: "Mở VSCode Workspaces trong System Explorer"
          command: "mod open ws"
          summary: "Mở thư mục chứa các VSCode workspace trong File Explorer."
          details: "Chạy `start D:/D-Documents/VSCode-Workspaces`."
          conditions: "Thư mục `D:/D-Documents/VSCode-Workspaces` phải tồn tại."
        - id: "ACTION 03"
          title: "Mở Environment Variables Panel"
          command: "mod open env"
          summary: "Mở panel Environment Variables của Windows."
          details: "Chạy `rundll32.exe sysdm.cpl,EditEnvironmentVariables`."
          conditions: "Chỉ hoạt động trên Windows."
        - id: "ACTION 04"
          title: "Mở Prompts Folder"
          command: "mod open proms"
          summary: "Mở thư mục Prompts của Template Replacer Extension trong File Explorer."
          details: "Chạy `start <TEMPLATE_REPLACER_FOLDER_PATH>/Prompts`."
          conditions: "Biến môi trường `TEMPLATE_REPLACER_FOLDER_PATH` phải được cấu hình trong `.env`."

    - name: "code"
      description: "Mở trong IDE"
      actions:
        - id: "ACTION 05"
          title: "Mở mod files trong IDE"
          command: "mod code"
          summary: "Mở thư mục gốc của mod project trong IDE."
          details: "Chạy `code <MOD_ROOT_FOLDER>` hoặc `anti ...` tùy flag `-a`."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 06"
          title: "Mở Working Workspace"
          command: "mod code ws <value> [-p]"
          summary: "Mở một working workspace cụ thể trong IDE và terminal."
          details: "Gọi `open_main_ws.py` với toàn bộ remaining args. Script tự parse value và flag `-p`. `ptb` → Mở Photobooth project. `tool` → Mở gdrive-tool project. Flag `-p` chỉ mở terminal, bỏ qua IDE."
          conditions: "<value> phải là `ptb` hoặc `tool`. Cần Chrome và Windows Terminal (`wt`) đã cài."
        - id: "ACTION 07"
          title: "Mở Testing Folder"
          command: "mod code test"
          summary: "Mở thư mục Testing chung trong IDE."
          details: "Chạy `code D:/D-Documents/Testing`."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 08"
          title: "Mở TypeScript Template"
          command: "mod code ts-template"
          summary: "Mở thư mục template Express server TypeScript trong IDE."
          details: "Chạy `code D:/D-Documents/Templates/standard-express-server-ts`."
          conditions: "Thư mục template phải tồn tại."
        - id: "ACTION 09"
          title: "Mở Testing JS/TS Folder"
          command: "mod code js | mod code ts"
          summary: "Mở thư mục testing JavaScript/TypeScript trong IDE."
          details: "Chạy `code D:/D-Documents/Testing/js-ts`."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 10"
          title: "Mở NestJS Template"
          command: "mod code nestjs"
          summary: "Mở thư mục NestJS template trong IDE."
          details: "Chạy `code D:/D-Documents/Code_VCN/nestjs`."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 11"
          title: "Mở Testing Python Folder"
          command: "mod code py"
          summary: "Mở thư mục testing Python trong IDE."
          details: "Chạy `code D:/D-Documents/Testing/py`."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 12"
          title: "Mở Browser Extensions Folder"
          command: "mod code ext"
          summary: "Mở thư mục chứa các browser extension trong IDE."
          details: "Chạy `code D:/D-Documents/Browser-Extensions`."
          conditions: "Không có điều kiện đặc biệt."

    - name: "edit"
      description: "Chỉnh sửa"
      actions:
        - id: "ACTION 13"
          title: "Edit Prompts"
          command: "mod edit proms"
          summary: "Mở thư mục prompts trong notepad."
          details: "Chạy `notepad D:/D-Documents/Template Replacer Extension/Prompts`."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 14"
          title: "Edit Profile"
          command: "mod edit to"
          summary: "Mở file $PROFILE trong notepad."
          details: "Chạy `notepad $PROFILE`."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 14b"
          title: "Edit Useful Commands"
          command: "mod edit cmds"
          summary: "Chỉnh sửa danh sách các lệnh hữu ích."
          details: "Mở file `contents/list_useful_commands.txt` trong notepad để người dùng tự chỉnh sửa."
          conditions: "File `list_useful_commands.txt` phải tồn tại."

    - name: "git"
      description: "Thao tác Git"
      actions:
        - id: "ACTION 15"
          title: "Git Commit & Push"
          command: 'mod git commit -m "message"'
          summary: "Chạy tuần tự `git add .`, `git commit`, `git push` ngay trong tab terminal hiện tại."
          details: 'Dispatcher forward toàn bộ remaining args (`-m "message"`) cho `_git.py`. Script `_git.py` tự parse flag `-m`/`--message` để lấy commit message. Chạy tại thư mục `MOD_ROOT_FOLDER`.'
          conditions: 'Flag `-m "message"` là bắt buộc (do _git.py validate). Cần `git` đã cài và `MOD_ROOT_FOLDER` phải là git repository có remote `origin`.'
        - id: "ACTION 15b"
          title: "Xem Git Remote URL"
          command: "mod git remote"
          summary: "In danh sách remote URL của git repository (git remote -v)."
          details: "Chạy `git remote -v` tại `MOD_ROOT_FOLDER` để hiển thị các remote."
          conditions: "Cần `git` đã cài và `MOD_ROOT_FOLDER` phải là git repository."

    - name: "run"
      description: "Thực thi script"
      actions:
        - id: "ACTION 16"
          title: "Chạy UniKey"
          command: "mod run unikey"
          summary: "Khởi động ứng dụng gõ tiếng Việt UniKey."
          details: "Chạy `start C:/Users/dell/Downloads/UniKeyNT.exe`."
          conditions: "File `UniKeyNT.exe` phải tồn tại tại đường dẫn cứng trong code."
        - id: "ACTION 22"
          title: "Tạo QR Image"
          command: "mod run gen-qr"
          summary: "Sinh QR image từ text nhập tương tác."
          details: "Không nhận args từ CLI. Script chạy interactive, hỏi text input."
          conditions: "Package `qrcode` phải được cài đặt. Biến `MOD_APPDATA_FOLDER_PATH` phải có trong `.env`."
        - id: "ACTION 40"
          title: "Giữ Nhịp Máy Chủ (Keep-Awake)"
          command: "mod run keep-awake [healthcheck_url] [-i interval]"
          summary: "Chạy công cụ giữ nhịp (keep-alive) để ngăn máy chủ từ xa rơi vào trạng thái ngủ đông."
          details: "Các đối số còn lại (remaining args) được chuyển tiếp cho tập lệnh Python xử lý việc giữ nhịp (ví dụ: `keep_awake.py`). Tập lệnh này sẽ tự động phân tích URL kiểm tra sức khỏe và cờ `-i`/`--interval`. Hỗ trợ thời gian chờ cố định (ví dụ: 6s, 2m, 1.5h) hoặc ngẫu nhiên nếu không truyền tham số."
          conditions: "Môi trường Python phải được cài đặt thư viện `requests`."
        - id: "ACTION 46"
          title: "Giữ Màn Hình Mở (Keep-Screen)"
          command: "mod run keep-screen"
          summary: "Chạy công cụ giữ màn hình Windows luôn mở."
          details: "Sử dụng thư viện `ctypes` để gọi API hệ thống Windows (SetThreadExecutionState) nhằm ngăn màn hình tắt. Chương trình sẽ chạy ngầm định và chỉ thoát khi nhấn phím 'q' hoặc tổ hợp 'Ctrl+C'."
          conditions: "Chỉ hoạt động trên hệ điều hành Windows."
        - id: "ACTION 44"
          title: "Đếm Dòng SRT"
          command: "mod run srt-count-line [file_path]"
          summary: "Đếm số dòng text thực tế trong file phụ đề SRT."
          details: "Chuyển tiếp cho `srt_count_line.py` để phân tích và đếm."
          conditions: "Cần truyền file path hợp lệ."

    - name: "file"
      description: "Thao tác với file"
      actions:
        - id: "ACTION 17"
          title: "Tạo Files từ Template"
          command: "mod file create"
          summary: "Tạo file/folder từ danh sách template định nghĩa sẵn trong `files_source.txt`."
          details: "Đọc file `contents/files_source.txt` theo cú pháp `file-name[[name]]{{filename}} file-content{{content}}`. Hiển thị menu cho người dùng chọn. Tạo file/folder tại thư mục hiện tại (`os.getcwd()`). Không nhận args từ CLI."
          conditions: "File `contents/files_source.txt` phải tồn tại. Script chạy interactive."
        - id: "ACTION 19"
          title: "Rename Files"
          command: "mod file rename <folder_path> [prefix]"
          summary: "Đổi tên toàn bộ file trong folder theo dạng `<prefix>-1.ext`, `<prefix>-2.ext`, ..."
          details: "Remaining args được forward cho `rename_files.py`. Script tự parse `sys.argv[1]` (folder) và `sys.argv[2]` (prefix). Nếu không có prefix, tự detect hoặc dùng tên folder."
          conditions: "<folder_path> phải là thư mục hợp lệ."
        - id: "ACTION 20"
          title: "Delete Files by Extensions"
          command: "mod file delete <folder_path> <ext1,ext2,...>"
          summary: "Xóa tất cả file có extension nằm trong danh sách chỉ định."
          details: "Remaining args được forward cho `delete_files.py`. Script tự parse `sys.argv[1]` (folder) và `sys.argv[2]` (extension list). Chỉ xử lý file cấp 1."
          conditions: "Cả 2 tham số đều bắt buộc (do script validate)."
        - id: "ACTION 21"
          title: "Keep Files by Extension"
          command: "mod file keep <folder_path> <ext>"
          summary: "Giữ lại chỉ các file có extension chỉ định, xóa toàn bộ file còn lại trong folder."
          details: "Remaining args được forward cho `keep_files_with_ext.py`. Script tự parse `sys.argv[1]` (folder) và `sys.argv[2]` (extension). Chỉ xử lý file cấp 1."
          conditions: "Cả 2 tham số đều bắt buộc."

    - name: "folder"
      description: "Thao tác với folder"
      actions:
        - id: "ACTION 39"
          title: "Tạo Folder Mới"
          command: "mod folder create <folder_path> [pattern] [starting_index] [num_folders]"
          summary: "Tạo một hoặc nhiều thư mục con với tên tự động theo pattern và index tiếp theo."
          details: "Tự động phân tích các thư mục con trong `folder_path` để tìm pattern. Nếu truyền 1 số, số đó là starting index. Nếu truyền 2 số, chúng lần lượt là starting index và số lượng folder muốn tạo."
          conditions: "`folder_path` phải hợp lệ."
        - id: "ACTION 18"
          title: "Đặt Download Path trong Chrome"
          command: "mod folder dld-path [folder_name]"
          summary: "Thay đổi thư mục download mặc định của Chrome cho tất cả profile."
          details: "Remaining args được forward cho `set_download_path_in_chrome.py`. Script tự parse `sys.argv[1]` nếu có để lấy folder_name. Nếu không truyền tên, tự tạo `download-{N}`."
          conditions: "Chrome phải được tắt hoàn toàn trước khi chạy."
        - id: "ACTION 45"
          title: "In Cấu Trúc Cây Thư Mục"
          command: "mod folder tree"
          summary: "In ra cấu trúc dạng cây của thư mục hiện tại."
          details: "Gọi `print_folder_tree.py` để in ra terminal."
          conditions: "Không có điều kiện đặc biệt."

    - name: "print"
      description: "In thông tin"
      actions:
        - id: "ACTION 23"
          title: "In OS Info"
          command: "mod print os"
          summary: "In thông tin hệ thống của máy tính."
          details: "Chạy `systeminfo`, `wmic cpu get name`, `ipconfig` và lọc ra các thông tin quan trọng."
          conditions: "Chỉ hoạt động trên Windows."
        - id: "ACTION 24"
          title: "In Mod Statuses Info"
          command: "mod print stts"
          summary: "In mô tả các mod status code."
          details: "Đọc và in file `contents/statuses.txt`."
          conditions: "File `contents/statuses.txt` phải tồn tại."
        - id: "ACTION 25"
          title: "In VSCode Workspaces"
          command: "mod print ws"
          summary: "In danh sách các VSCode workspace file trong thư mục Workspaces."
          details: "Gọi `_print_root_folder.py` với đường dẫn `D:/D-Documents/VSCode-Workspaces`."
          conditions: "Thư mục `D:/D-Documents/VSCode-Workspaces` phải tồn tại."
        - id: "ACTION 26"
          title: "In cURL Reference"
          command: "mod print curl"
          summary: "In tài liệu tham chiếu cú pháp cURL (CRUD)."
          details: "Đọc và in file `contents/cURL.txt`."
          conditions: "File `contents/cURL.txt` phải tồn tại."
        - id: "ACTION 27"
          title: "In Mod Directory Path"
          command: "mod print dir"
          summary: "In đường dẫn tuyệt đối của thư mục mod src."
          details: "Gọi `os.path.dirname(os.path.abspath(__file__))` và in ra terminal."
          conditions: "Không có điều kiện đặc biệt."
        - id: "ACTION 28"
          title: "In Useful Commands"
          command: "mod print cmds"
          summary: "In danh sách các lệnh hữu ích thường dùng."
          details: "Đọc và in file `contents/list_useful_commands.txt`."
          conditions: "File `contents/list_useful_commands.txt` phải tồn tại."
        - id: "ACTION 29"
          title: "In Help"
          command: "mod | mod -h"
          summary: "In hướng dẫn sử dụng mod tool."
          details: "Đọc và in file `contents/help.txt`."
          conditions: "File `contents/help.txt` phải tồn tại."

    - name: "gdrive"
      description: "Thao tác với Google Drive qua rclone"
      actions:
        - id: "ACTION 30"
          title: "Đồng bộ thư mục lên GDrive"
          command: 'mod gdrive sync "<source_folder>" "<dest_path>"'
          summary: "Sử dụng rclone để đồng bộ một thư mục từ máy tính lên Google Drive."
          details: "Remaining args được forward cho `sync_to_gdrive.py` cùng action `sync`. Script tự parse source và dest."
          conditions: "Cần 2 tham số. Cần có rclone."
        - id: "ACTION 31"
          title: "Đọc danh sách folder GDrive"
          command: "mod gdrive list [target_path] [-d] [--file]"
          summary: "Liệt kê thư mục hoặc file trên Google Drive remote."
          details: "Remaining args (bao gồm cả `-d`, `--file`) được forward cho `sync_to_gdrive.py`. Script tự parse flags."
          conditions: "Cần có rclone."
        - id: "ACTION 32"
          title: "Reset Cấu hình GDrive"
          command: "mod gdrive reset"
          summary: "Xóa cấu hình rclone hiện tại."
          details: "Cho phép xóa một remote cụ thể hoặc toàn bộ."
          conditions: "Chạy interactive."
        - id: "ACTION 33"
          title: "Mở hướng dẫn cấu hình GDrive"
          command: "mod gdrive guide"
          summary: "Mở file hướng dẫn về gdrive."
          details: "Mở notepad cho `sync-to-gdrive/AUTH_GUIDE.txt`."
          conditions: "File cần tồn tại."
        - id: "ACTION 34"
          title: "Xóa folder trên GDrive"
          command: "mod gdrive del-fd <remote_folder>"
          summary: "Xóa một folder trên Google Drive remote."
          details: "Remaining args forward cho script. Có hỏi xác nhận trước khi xóa."
          conditions: "Cần truyền tên folder."
        - id: "ACTION 35"
          title: "Lấy URL remote path"
          command: "mod gdrive url <remote_path> | mod gdrive link <remote_path>"
          summary: "Lấy link truy cập cho remote path."
          details: "Remaining args forward cho script."
          conditions: "Cần truyền path."
        - id: "ACTION 36"
          title: "Xem thông tin remote"
          command: "mod gdrive remote"
          summary: "In thông tin cấu hình và dung lượng của remote."
          details: "Không cần args."
          conditions: "Cần có rclone."
        - id: "ACTION 36b"
          title: "Tải File từ URL (GDrive DL)"
          command: "mod gdrive dl <url> [--dest <path>] [--folder <name>]"
          summary: "Tải file từ mạng/URL về máy cục bộ vào thư mục chỉ định."
          details: "Sử dụng tính năng tải file của gdrive tool. Có thể truyền `--dest <path>` để chỉ định thư mục lưu hoặc `--folder <name>` để tạo/lưu vào thư mục con."
          conditions: "Cần URL hợp lệ."

    - name: "init"
      description: "Khởi tạo máy tính"
      actions:
        - id: "ACTION 37"
          title: "Chạy init Script"
          command: "mod init"
          summary: "Thực thi script dọn dẹp hệ thống."
          details: "Chạy file batch `init.cmd` trong `src/cmd`."
          conditions: "File `init.cmd` phải tồn tại."

    - name: "py"
      description: "Python helpers"
      actions:
        - id: "ACTION 38"
          title: "Setup Python venv"
          command: "mod py env"
          summary: "Thiết lập môi trường ảo Python cho project hiện tại."
          details: "Chạy `setup_venv_in_project.py`. Không nhận remaining args từ dispatcher."
          conditions: "Cần Python trong PATH."

    - name: "tunnel"
      description: "Cloudflare Tunnel Wrapper"
      actions:
        - id: "ACTION 41"
          title: "Khởi tạo Cloudflare Tunnel"
          command: "mod tunnel [port]"
          summary: "Chạy cloudflared tunnel trỏ tới localhost tại port được chỉ định."
          details: "Mặc định sử dụng port 3000. Wrapper tự động kiểm tra xem cloudflared đã được cài đặt hay chưa. Cần có file binary cloudflared trong PATH."
          conditions: "File binary cloudflared phải nằm trong PATH hệ thống."

    - name: "proxy"
      description: "Kiểm tra Proxy"
      actions:
        - id: "ACTION 42"
          title: "Kiểm tra Proxy"
          command: "mod proxy test <ip>:<port>[:<login>:<password>] [--protocol <scheme>]"
          summary: "Kiểm tra kết nối và tính hợp lệ của proxy."
          details: "Kiểm tra bằng cách: 1. Sử dụng Python requests gửi request tới google.com. 2. Dùng lệnh hệ thống cURL để lấy HTTP header từ google.com. 3. Trích xuất IP đầu ra của proxy thông qua api.ipify.org. Mặc định kiểm tra với giao thức socks5."
          conditions: "Tham số truyền vào phải đúng định dạng ip:port hoặc ip:port:login:pass."

    - name: "mcp"
      description: "Quản lý MCP"
      actions:
        - id: "ACTION 43"
          title: "Thiết lập MCP Folder"
          command: "mod mcp set [mcp_folder_name] [dest_folder_path]"
          summary: "Sao chép thư mục MCP từ đường dẫn gốc vào thư mục đích."
          details: "Liệt kê và cho phép chọn các thư mục trong LOCAL_ABSOLUTE_FOLDER_PATH, sau đó copy toàn bộ nội dung thư mục đó vào dest_folder_path. Nếu dest_folder_path không có, mặc định là thư mục hiện tại (.)."
          conditions: "Đường dẫn LOCAL_ABSOLUTE_FOLDER_PATH phải tồn tại trong cấu hình."

    - name: "skill"
      description: "Quản lý AI Skills"
      actions:
        - id: "ACTION 48"
          title: "Thiết lập Skill Folder"
          command: "mod skill set [skill_name] [dest_folder_path]"
          summary: "Sao chép thư mục Skill AI từ kho lưu trữ vào thư mục đích."
          details: "Liệt kê và cho phép chọn các thư mục trong SKILLS_FOLDER_PATH (D:/D-Documents/SKILLs), sau đó copy toàn bộ nội dung thư mục đó vào dest_folder_path. Nếu dest_folder_path không truyền, mặc định là thư mục hiện tại (.)."
          conditions: "Đường dẫn SKILLS_FOLDER_PATH phải tồn tại trong cấu hình."

    - name: "toast"
      description: "Thông báo Desktop Windows"
      actions:
        - id: "ACTION 47"
          title: "Gửi Toast Notification & Cú pháp Notifier"
          command: "mod toast <title> [message...] [--audio <path>] | mod toast --syntax"
          summary: "Hiển thị thông báo Toast kèm âm thanh tùy chỉnh, hoặc xem cú pháp lệnh mod toast 1 dòng."
          details: "Sử dụng lệnh PowerShell `New-BurntToastNotification` kết hợp với đối tượng `[Microsoft.Toolkit.Uwp.Notifications.ToastAudio]` để gửi thông báo. Tham số đầu tiên sau `toast` là tiêu đề (title), các tham số tiếp theo là nội dung thông báo (message). Có thể chỉ định cờ `--audio <path>` để phát âm thanh mp3/wav cá nhân; mặc định sử dụng file âm thanh trong cấu hình (`TOAST_SOUND_AUDIO_FILE_PATH`). Dùng cờ `--syntax` để in ra cú pháp lệnh `mod toast` trên đúng 1 dòng (trên dòng mới để dễ copy)."
          conditions: "Yêu cầu hệ điều hành Windows và đã cài đặt module PowerShell `BurntToast`."

    - name: "compress"
      description: "Nén dự án hoặc thư mục tùy chỉnh"
      actions:
        - id: "ACTION 49"
          title: "Nén dự án thành file zip"
          command: "mod compress [output_path]"
          summary: "Nén toàn bộ mã nguồn dự án thành file zip 'mod-{dd}-{mm}-{yyyy}-{hh}-{mm}-{ss}.zip' và áp dụng bộ lọc .compressignore."
          details: "Đọc file `.compressignore` từ thư mục gốc dự án để bỏ qua các thư mục nặng hoặc nhạy cảm (.git, .venv, node_modules, cache, .env...). Tạo file zip với tên định dạng `mod-{dd}-{mm}-{yyyy}-{hh}-{mm}-{ss}.zip` tại thư mục gốc của dự án (hoặc output_path nếu truyền) và in ra đường dẫn lưu trữ cùng dung lượng sau khi nén."
          conditions: "Không có điều kiện bắt buộc."

        - id: "ACTION 50"
          title: "Nén thư mục tùy chỉnh theo cấu hình JSON"
          command: "mod compress folder <local_folder_path> [--config-file <config_path>]"
          summary: "Nén thư mục cục bộ theo quy tắc include-items và exclude-items từ file cấu hình JSON."
          details: "Mặc định tìm file `compress-config.json` tại thư mục đang đứng (cwd) hoặc trong thư mục đích. Hỗ trợ truyền file cấu hình tùy ý qua cờ `--config-file` (hoặc `-c`). File cấu hình chứa 2 trường: `include-items` (danh sách tệp/thư mục chỉ định nén) và `exclude-items` (danh sách tệp/thư mục bỏ qua). File zip được tạo trực tiếp tại thư mục đích và tự dọn dẹp các file zip cũ."
          conditions: "Tham số <local_folder_path> phải là thư mục hợp lệ tồn tại trên máy tính."



